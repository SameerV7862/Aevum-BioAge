<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aevum BioAge web assessment app.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aevum BioAge">

  <title>Aevum BioAge</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --app-vh: 100vh;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #080b0f;
    }

    @supports (height: 100dvh) {
      :root {
        --app-vh: 100dvh;
      }
    }

    body {
      min-height: var(--app-vh);
      min-height: -webkit-fill-available;
    }

    flutter-view {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: var(--app-vh);
      min-height: -webkit-fill-available;
    }
  </style>
</head>
<body>
  <!-- MediaPipe Pose bridge — must load before Flutter bootstrap -->
  <script src="mediapipe_pose_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
